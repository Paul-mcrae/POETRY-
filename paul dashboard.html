<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paul Poetry Dashboard - Auto</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:16px;max-width:600px;margin:auto}h1{color:#f5c518;text-align:center}.box{background:#151515;border:1px solid #222;border-radius:16px;padding:16px;margin:12px 0}input,textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:8px 0;font-size:14px;box-sizing:border-box}textarea{height:180px}button{background:#f5c518;color:#000;border:0;padding:14px 24px;border-radius:30px;font-weight:900;font-size:16px;width:100%;margin-top:10px;cursor:pointer}button:disabled{background:#333;color:#666}.small{color:#888;font-size:12px}.poem{background:#121212;border:1px solid #222;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.ok{color:#0f0;text-align:center;padding:10px}.err{color:#f55;text-align:center;padding:10px}</style></head><body>
<h1>PAUL POETRY<br>DASHBOARD AUTO 🚀</h1>

<div class="box">
<p class="small">Paste GitHub Token once - it stays saved in your phone:</p>
<input id="token" type="password" placeholder="Paste token ghp_xxxx here">
<button onclick="saveToken()" style="background:#333;color:#fff">Save Token</button>
<p id="tokenStatus" class="small"></p>
</div>

<div class="box">
<input id="title" placeholder="Poem Title">
<textarea id="text" placeholder="Poem text (8 stanzas)..."></textarea>
<button id="addBtn" onclick="addPoemAuto()">+ ADD POEM TO WEBSITE AUTOMATICALLY</button>
<p id="status"></p>
</div>

<div class="box">
<h3 style="color:#f5c518">Your Poems (<span id="count">0</span>)</h3>
<div id="list"></div>
</div>

<p style="text-align:center;margin-top:20px"><a href="https://paul-mcrae.github.io/POETRY-/" style="color:#f5c518">→ View Website</a></p>

<script>
let poems=JSON.parse(localStorage.getItem('my_poems_auto')||`[["THE COFFEE WE SHARE","I wake before the kettle sings your name..."],["HOW YOU FOLD MY SHIRTS","You fold my shirts like you mean it..."],["YOUR KEYS ON MY TABLE","Your keys land loud on my table..."],["GROCERY LIST LOVE","We write our grocery list on the back of bills..."],["WE COOK UGLY RICE","We cook rice that always sticks a bit..."],["THE DISHES AT MIDNIGHT","We do dishes at midnight again..."],["NIGHT BUS YOUR HEAD ON MY SHOULDER","The night bus smells of diesel..."],["YOUR UMBRELLA IS TOO SMALL","Your umbrella is too small for two..."],["HOW YOU STEAL MY HOODIE","You steal my hoodie every cold morning..."],["THE WAY YOU CHARGE MY PHONE","My phone dies always at eleven percent..."]]`);
const REPO="paul-mcrae/POETRY-"; const FILE="index.html";
function saveToken(){let t=document.getElementById('token').value.trim();if(!t)return alert('Paste token');localStorage.setItem('gh_token',t);document.getElementById('tokenStatus').innerText='✅ Token saved!';document.getElementById('token').value='';checkToken()}
function checkToken(){let t=localStorage.getItem('gh_token');if(t){document.getElementById('tokenStatus').innerText='✅ Token ready - auto update active'}else{document.getElementById('tokenStatus').innerText='❌ No token - add token first'}}
function render(){document.getElementById('list').innerHTML=poems.map((p,i)=>`<div class="poem"><span><b>${p[0]}</b></span><span style="color:#f55;cursor:pointer" onclick="delPoem(${i})">❌</span></div>`).join('');document.getElementById('count').innerText=poems.length;localStorage.setItem('my_poems_auto',JSON.stringify(poems))}
async function getFile(){let token=localStorage.getItem('gh_token');let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{headers:{Authorization:`token ${token}`}});let data=await res.json();return data}
function buildHTML(poemsArr){let poemsJS=JSON.stringify(poemsArr);return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PAUL POETRY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif}header{background:#111;padding:14px;display:flex;justify-content:space-between;align-items:center}header b span{color:#f5c518}.wa{background:#f5c518;color:#000;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:800;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.grid img{width:100%;height:180px;object-fit:cover;border-radius:16px;transition:1s}.title{padding:24px 16px 8px;font-size:26px;font-weight:900}.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px}.card h3{color:#f5c518;margin-bottom:8px}.card p{white-space:pre-line;line-height:1.6;color:#ddd;font-size:14px}.acts{display:flex;gap:10px;margin-top:12px;border-top:1px solid #222;padding-top:10px}.acts button{background:#222;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}.acts button.liked{background:#f5c518;color:#000}.cbox{display:none;margin-top:10px;background:#111;padding:10px;border-radius:10px}.cbox.on{display:block}.cbox input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:8px;border-radius:8px}.citem{background:#222;padding:6px 8px;border-radius:8px;margin-top:6px;font-size:13px}</style></head><body><header><b><span>PAUL</span> POETRY</b><a class="wa" href="https://wa.me/256709478798">WhatsApp Me</a></header><div class="grid" id="g"><img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"><img src="https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"></div><div class="title">Latest Poems 🔥</div><div id="poems"></div><script>const poems=${poemsJS};let h="";poems.forEach((p,i)=>{h+=\`<div class="card"><h3>\${p[0]}</h3><p>\${p[1]}</p><div class="acts"><button id="l\${i}" onclick="like(\${i})">❤️ <span id="c\${i}">0</span> Like</button><button onclick="share(\${i})">↗️ Share</button><button onclick="document.getElementById('b\${i}').classList.toggle('on')">💬 Comment</button></div><div class="cbox" id="b\${i}"><input placeholder="Write comment + Enter" onkeydown="if(event.key==='Enter'){add(\${i},this.value);this.value=''}"><div id="d\${i}"></div></div></div>\`});document.getElementById("poems").innerHTML=h;function like(i){let L=JSON.parse(localStorage.likes||"{}");L[i]=(L[i]||0)+1;localStorage.likes=JSON.stringify(L);document.getElementById("c"+i).innerText=L[i];document.getElementById("l"+i).classList.add("liked")}function share(i){let t=poems[i][0]+" - Paul Poetry https://paul-mcrae.github.io/POETRY-/";window.open("https://wa.me/?text="+encodeURIComponent(t))}function add(i,v){let C=JSON.parse(localStorage.comments||"{}");if(!C[i])C[i]=[];C[i].push(v);localStorage.comments=JSON.stringify(C);show(i)}function show(i){let C=JSON.parse(localStorage.comments||"{}");let d=document.getElementById("d"+i);if(C[i])d.innerHTML=C[i].map(x=>\`<div class="citem">💬 \${x}</div>\`).join("")}let L=JSON.parse(localStorage.likes||"{}");Object.keys(L).forEach(i=>{let e=document.getElementById("c"+i);if(e)e.innerText=L[i]});let C=JSON.parse(localStorage.comments||"{}");Object.keys(C).forEach(i=>show(i));const pool=["https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800","https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800","https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800","https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=800"];setInterval(()=>{document.querySelectorAll("#g img").forEach(img=>{let r=pool[Math.floor(Math.random()*pool.length)];img.style.opacity=0;setTimeout(()=>{img.src=r;img.style.opacity=1},600)})},60000);<\/script></body></html>`;}
async function addPoemAuto(){let token=localStorage.getItem('gh_token');if(!token){alert('First paste GitHub token!');return}let t=document.getElementById('title').value.trim(),tx=document.getElementById('text').value.trim();if(!t||!tx)return alert('Fill title and poem');document.getElementById('status').innerHTML='⏳ Adding to website...';document.getElementById('addBtn').disabled=true;try{poems.unshift([t,tx]);let html=buildHTML(poems);let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Add poem: ${t}`,content:content,sha:file.sha})});if(res.ok){document.getElementById('status').innerHTML='<div class="ok">✅ POEM ADDED! Website will update in 1-2 mins!</div>';document.getElementById('title').value='';document.getElementById('text').value='';render()}else{let err=await res.text();document.getElementById('status').innerHTML=`<div class="err">❌ Failed: ${err}</div>`;poems.shift()} }catch(e){document.getElementById('status').innerHTML=`<div class="err">❌ Error: ${e.message}</div>`;poems.shift()}document.getElementById('addBtn').disabled=false}
async function delPoem(i){if(!confirm('Delete this poem?'))return;let token=localStorage.getItem('gh_token');if(!token){alert('Need token');return}document.getElementById('status').innerHTML='⏳ Deleting...';poems.splice(i,1);let html=buildHTML(poems);let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Delete poem ${i}`,content:content,sha:file.sha})});if(res.ok){document.getElementById('status').innerHTML='<div class="ok">✅ Deleted! Website updates in 1-2 mins</div>';render()}else{document.getElementById('status').innerHTML='<div class="err">❌ Delete failed</div>'}}
checkToken();render();
</script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - P&J Poetry</title>
<style>
body{background:#0f0e11;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
#box{background:#1c1b1f;padding:30px;border-radius:18px;width:90%;max-width:420px;text-align:center;border:1px solid #333}
input{width:100%;padding:14px;border-radius:10px;border:none;margin:15px 0;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;border-radius:10px;border:none;background:#ffcc66;font-weight:bold;font-size:16px}
#panel{display:none}textarea{width:100%;height:150px;background:#2a2930;color:#fff;border-radius:10px;padding:10px;box-sizing:border-box}
</style>
</head>
<body>
<div id="box">
<div id="login">
<h2>P&J Dashboard</h2>
<p>Password is paul</p>
<input id="pass" type="text" placeholder="Type paul">
<button onclick="go()">Unlock</button>
<p id="err" style="color:#ff6b6b"></p>
</div>
<div id="panel">
<h2>Welcome Paul!</h2>
<p>Dashboard is working!</p>
<a href="index.html" style="color:#ffcc66">Back to Site</a>
</div>
</div>
<script>
function go(){
let p=document.getElementById('pass').value.trim().toLowerCase();
if(p==='paul'){
document.getElementById('login').style.display='none';
document.getElementById('panel').style.display='block';
}else{
document.getElementById('err').innerText='Wrong - type: paul';
}
}
</script>
</body>
</html>

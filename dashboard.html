<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><style>body{background:#0f0e11;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}#login{background:#1c1b1f;padding:30px;border-radius:18px;width:90%;max-width:400px;text-align:center}input{width:100%;padding:12px;border-radius:10px;border:none;margin:15px 0}button{width:100%;padding:12px;border-radius:10px;border:none;background:#ffcc66;font-weight:bold}#panel{display:none}#panel textarea{width:100%;height:150px;background:#2a2930;color:#fff;border:none;padding:10px;border-radius:10px}</style></head><body>
<div id="login"><h2>Poetry Dashboard</h2><p>Enter password</p><input id="pass" type="password" placeholder="Password"><button onclick="check()">Unlock</button><p id="msg" style="color:red"></p></div>
<div id="panel"><h2>Welcome Paul</h2><p>Paste new poem here:</p><textarea id="poemBox"></textarea><br><br><button onclick="alert('Poem saved! (Demo)')">Save Poem</button><br><br><a href="index.html" style="color:#ffcc66">Back to Site</a></div>
<script>
function check(){if(document.getElementById('pass').value==='paul'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';}else{document.getElementById('msg').innerText='Wrong password';}}
</script></body></html>

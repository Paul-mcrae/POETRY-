<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paul Control</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}#lock{background:#111;border:1px solid #222;border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center}#lock h2{color:#f5c518;margin-bottom:12px}#passBox{position:relative;display:flex;align-items:center}input{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;padding:14px;border-radius:30px;margin:8px 0;font-size:16px;outline:none}button{background:#f5c518;color:#000;border:0;padding:14px 24px;border-radius:30px;font-weight:900;width:100%;margin-top:10px;cursor:pointer}#eye{position:absolute;right:14px;background:none;border:0;width:auto;padding:0;font-size:20px;cursor:pointer}#dash{display:none;width:100%;max-width:600px}#dash .box{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px 0}h1{color:#f5c518;text-align:center;font-size:22px}.poem{background:#0a0a0a;border:1px solid #222;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between}.ok{color:#0f0;text-align:center}.err{color:#f55;text-align:center}.small{color:#888;font-size:12px;text-align:center}</style></head><body>

<div id="lock">
<h2>PAUL CONTROL 🔒</h2>
<p class="small">Secret Dashboard - Only You</p>
<div id="passBox">
<input id="pass" type="password" placeholder="Password">
<button id="eye" onclick="toggleEye()">👁️</button>
</div>
<button onclick="unlock()">Unlock</button>
<p id="msg" style="color:#f55;margin-top:10px"></p>
</div>

<div id="dash">
<h1>PAUL POETRY DASHBOARD 🚀</h1>
<p class="small">Add poems - Auto updates website in 2 mins</p>

<div class="box">
<p class="small">GitHub Token (paste once, saved):</p>
<div style="position:relative;display:flex;align-items:center">
<input id="token" type="password" placeholder="ghp_xxxx">
<button onclick="toggleEye2()" style="position:absolute;right:10px;background:none;width:auto;color:#fff">👁️</button>
</div>
<button onclick="saveToken()" style="background:#222;color:#fff">Save Token</button>
<p id="tokenStatus" class="small"></p>
</div>

<div class="box">
<input id="title" placeholder="Poem Title e.g. MY NIGHT WITH YOU">
<textarea id="text" placeholder="Poem text..." style="width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;padding:12px;border-radius:12px;margin:8px 0;height:180px"></textarea>
<button id="addBtn" onclick="addAuto()">+ ADD TO WEBSITE AUTOMATICALLY</button>
<p id="status"></p>
</div>

<div class="box">
<h3 style="color:#f5c518">Your Poems: <span id="count">0</span></h3>
<div id="list"></div>
</div>

<p style="text-align:center"><a href="https://paul-mcrae.github.io/POETRY-/" style="color:#f5c518">→ View Live Website</a></p>
</div>

<script>
let poems=JSON.parse(localStorage.getItem('my_poems_v9')||`[["THE COFFEE WE SHARE","I wake before the kettle sings your name,\\nThe kitchen cold without your sleepy light..."],["HOW YOU FOLD MY SHIRTS","You fold my shirts like you mean it..."],["YOUR KEYS ON MY TABLE","Your keys land loud on my table..."],["GROCERY LIST LOVE","We write our grocery list on the back of bills..."],["WE COOK UGLY RICE","We cook rice that always sticks a bit..."],["THE DISHES AT MIDNIGHT","We do dishes at midnight again..."],["NIGHT BUS YOUR HEAD ON MY SHOULDER","The night bus smells of diesel..."],["YOUR UMBRELLA IS TOO SMALL","Your umbrella is too small for two..."],["HOW YOU STEAL MY HOODIE","You steal my hoodie every cold morning..."],["THE WAY YOU CHARGE MY PHONE","My phone dies always at eleven percent..."]]`);
const REPO="paul-mcrae/POETRY-"; const FILE="index.html";
function toggleEye(){let p=document.getElementById('pass');p.type=p.type==='password'?'text':'password'}
function toggleEye2(){let p=document.getElementById('token');p.type=p.type==='password'?'text':'password'}
function unlock(){if(document.getElementById('pass').value==='Charles'){document.getElementById('lock').style.display='none';document.getElementById('dash').style.display='block';checkToken();render()}else{document.getElementById('msg').innerText='Wrong password!'}}
function saveToken(){let t=document.getElementById('token').value.trim();if(!t)return alert('Paste token');localStorage.setItem('gh_token',t);document.getElementById('tokenStatus').innerText='✅ Token saved - auto mode ON';document.getElementById('token').value=''}
function checkToken(){let t=localStorage.getItem('gh_token');document.getElementById('tokenStatus').innerText=t?'✅ Token ready':'❌ Add token first - get from github.com/settings/tokens/new'}
function render(){document.getElementById('list').innerHTML=poems.map((p,i)=>`<div class="poem"><span><b>${p[0]}</b></span><span style="color:#f55;cursor:pointer" onclick="delPoem(${i})">❌</span></div>`).join('');document.getElementById('count').innerText=poems.length;localStorage.setItem('my_poems_v9',JSON.stringify(poems))}
async function getFile(){let token=localStorage.getItem('gh_token');let r=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{headers:{Authorization:`token ${token}`}});return await r.json()}
function buildHTML(a){let j=JSON.stringify(a);return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PAUL POETRY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif}header{background:#111;padding:14px;display:flex;justify-content:space-between;align-items:center}header b span{color:#f5c518}.wa{background:#f5c518;color:#000;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:800;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.grid img{width:100%;height:180px;object-fit:cover;border-radius:16px;transition:1s}.title{padding:24px 16px 8px;font-size:26px;font-weight:900}.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px}.card h3{color:#f5c518;margin-bottom:8px}.card p{white-space:pre-line;line-height:1.6;color:#ddd;font-size:14px}.acts{display:flex;gap:10px;margin-top:12px;border-top:1px solid #222;padding-top:10px}.acts button{background:#222;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}.acts button.liked{background:#f5c518;color:#000}.cbox{display:none;margin-top:10px;background:#111;padding:10px;border-radius:10px}.cbox.on{display:block}.cbox input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:8px;border-radius:8px}.citem{background:#222;padding:6px 8px;border-radius:8px;margin-top:6px;font-size:13px}</style></head><body><header><b><span>PAUL</span> POETRY</b><a class="wa" href="https://wa.me/256709478798">WhatsApp Me</a></header><div class="grid" id="g"><img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"><img src="https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"></div><div class="title">Latest Poems 🔥</div><div id="poems"></div><script>const poems=${j};let h="";poems.forEach((p,i)=>{h+=\`<div class="card"><h3>\${p[0]}</h3><p>\${p[1]}</p><div class="acts"><button id="l\${i}" onclick="like(\${i})">❤️ <span id="c\${i}">0</span> Like</button><button onclick="share(\${i})">↗️ Share</button><button onclick="document.getElementById('b\${i}').classList.toggle('on')">💬 Comment</button></div><div class="cbox" id="b\${i}"><input placeholder="Write comment + Enter" onkeydown="if(event.key==='Enter'){add(\${i},this.value);this.value=''}"><div id="d\${i}"></div></div></div>\`});document.getElementById("poems").innerHTML=h;function like(i){let L=JSON.parse(localStorage.likes||"{}");L[i]=(L[i]||0)+1;localStorage.likes=JSON.stringify(L);document.getElementById("c"+i).innerText=L[i];document.getElementById("l"+i).classList.add("liked")}function share(i){let t=poems[i][0]+" - Paul Poetry https://paul-mcrae.github.io/POETRY-/";window.open("https://wa.me/?text="+encodeURIComponent(t))}function add(i,v){let C=JSON.parse(localStorage.comments||"{}");if(!C[i])C[i]=[];C[i].push(v);localStorage.comments=JSON.stringify(C);show(i)}function show(i){let C=JSON.parse(localStorage.comments||"{}");let d=document.getElementById("d"+i);if(C[i])d.innerHTML=C[i].map(x=>\`<div class="citem">💬 \${x}</div>\`).join("")}let L=JSON.parse(localStorage.likes||"{}");Object.keys(L).forEach(i=>{let e=document.getElementById("c"+i);if(e)e.innerText=L[i]});let C=JSON.parse(localStorage.comments||"{}");Object.keys(C).forEach(i=>show(i));const pool=["https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800","https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800","https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800","https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=800"];setInterval(()=>{document.querySelectorAll("#g img").forEach(img=>{let r=pool[Math.floor(Math.random()*pool.length)];img.style.opacity=0;setTimeout(()=>{img.src=r;img.style.opacity=1},600)})},60000);<\/script></body></html>`;}
async function addAuto(){let token=localStorage.getItem('gh_token');if(!token){alert('Add GitHub token first! Go to github.com/settings/tokens/new');return}let t=document.getElementById('title').value.trim(),tx=document.getElementById('text').value.trim();if(!t||!tx)return alert('Fill both');document.getElementById('status').innerHTML='⏳ Updating website...';document.getElementById('addBtn').disabled=true;poems.unshift([t,tx]);let html=buildHTML(poems);try{let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Add: ${t}`,content:content,sha:file.sha})});if(res.ok){document.getElementById('status').innerHTML='<div class="ok">✅ LIVE in 2 mins! With ❤️↗️💬 + random images</div>';document.getElementById('title').value='';document.getElementById('text').value='';render()}else{document.getElementById('status').innerHTML='<div class="err">❌ Failed - check token has repo permission</div>';poems.shift()}}catch(e){document.getElementById('status').innerHTML=`<div class="err">Error ${e.message}</div>`;poems.shift()}document.getElementById('addBtn').disabled=false}
async function delPoem(i){if(!confirm('Delete?'))return;let token=localStorage.getItem('gh_token');if(!token)return alert('Need token');poems.splice(i,1);let html=buildHTML(poems);let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Delete ${i}`,content:content,sha:file.sha})});if(res.ok){render();document.getElementById('status').innerHTML='<div class="ok">✅ Deleted - updates in 2 mins</div>'}else{document.getElementById('status').innerHTML='<div class="err">Delete failed</div>'}}
</script></body></html>

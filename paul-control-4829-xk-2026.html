<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Paul Control V8</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffcc66;--bg:#08070a;--card:#131217;--card2:#1b1a21;--line:#26252e;--text:#f5f3ef;--muted:#9a99a5}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
h1,h2{font-family:'Playfair Display',serif}
.login{max-width:380px;margin:60px auto;text-align:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.btn{padding:11px 16px;border-radius:999px;background:var(--gold);color:#111;font-weight:800;font-size:12px;border:none;cursor:pointer}
.btn-dark{background:var(--card2);color:#fff;border:1px solid var(--line)}
.input{width:100%;padding:12px 14px;border-radius:12px;background:#1b1a21;border:1px solid #2a2932;color:#fff;margin-top:8px;font-size:13px}
.hidden{display:none!important}
.nav{position:sticky;top:0;z-index:30;background:rgba(8,7,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:220px 1fr;gap:16px}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.menu{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px}
.menu button{width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border:none;cursor:pointer;margin-bottom:2px}
.menu button.active{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.poem-row{padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:#121116}
.alert{padding:10px 12px;border-radius:10px;font-size:12px;margin-top:8px}
.alert-success{background:#132114;border:1px solid #254a1f;color:#8fdf8f}
.alert-error{background:#2a1414;border:1px solid #4a2222;color:#ff9a9a}
.pass-wrap{position:relative;display:flex;align-items:center}
.pass-wrap .input{padding-right:42px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);margin-top:4px;background:transparent;border:none;cursor:pointer;font-size:16px;opacity:0.7}
.eye:hover{opacity:1}
</style>
</head>
<body>

<div id="loginScreen" class="login">
<div style="font-size:48px">🔐</div>
<h1 style="font-size:26px;margin-top:8px">PAUL ONLY</h1>
<p style="color:var(--muted);font-size:12px;margin:6px 0 18px">Private access</p>
<div class="card" style="text-align:left">
<label style="font-size:11px;color:var(--muted)">PASSWORD</label>
<div class="pass-wrap">
<input id="passInput" type="password" class="input" placeholder="Enter password">
<button class="eye" onclick="toggleEye('passInput',this)" type="button">👁️</button>
</div>
<button class="btn" style="width:100%;margin-top:12px;padding:13px" onclick="login()">Unlock →</button>
<p id="loginError" style="color:#ff6e6e;font-size:12px;margin-top:8px;display:none">Wrong password!</p>
</div>
</div>

<div id="app" class="hidden">
<div class="nav">
<div style="font-weight:900;letter-spacing:1px;font-size:13px"><b style="color:var(--gold)">PAUL</b> CONTROL</div>
<div style="display:flex;gap:6px"><a class="btn btn-dark" href="index.html" target="_blank">View Site</a><button class="btn btn-dark" onclick="logout()">Logout</button></div>
</div>
<div class="main">
<div class="side"><div class="menu"><button class="active" id="btn-poems" onclick="showTab('poems')">📜 Poems</button><button id="btn-add" onclick="showTab('add')">✍️ Write</button><button id="btn-security" onclick="showTab('security')">🔐 Security</button></div></div>
<div class="content">
<div id="tab-poems"><div class="card"><h2 style="font-size:18px">📜 Your Poems</h2><input id="searchPoems" class="input" placeholder="Search..." oninput="renderPoems()"><div id="poemList"></div></div></div>
<div id="tab-add" class="hidden"><div class="card"><h2 style="font-size:18px">✍️ Write New Poem</h2><input type="hidden" id="editId"><input id="newTitle" class="input" placeholder="Title"><select id="newMood" class="input"><option>Most Loved ❤</option><option>Romantic • 2 AM</option><option>Deep Love</option><option>Poets' Favorite</option><option>Love Letter</option></select><textarea id="newBody" class="input" style="height:130px" placeholder="Poem body..."></textarea><input id="newLikes" type="number" class="input" value="24"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1" onclick="savePoem()">Save</button><button class="btn btn-dark" style="flex:1" onclick="clearForm()">Clear</button></div></div></div>
<div id="tab-security" class="hidden">
<div class="card"><h2 style="font-size:18px">🔐 Security</h2><p style="font-size:11px;color:var(--muted);margin-top:6px">Change your password anytime</p>
<div style="margin-top:16px;padding:14px;background:#1b1a21;border-radius:14px;border:1px solid var(--line)">
<label style="font-size:11px;color:var(--muted)">CURRENT PASSWORD</label>
<div class="pass-wrap">
<input id="currentPass" type="password" class="input" placeholder="Current password">
<button class="eye" onclick="toggleEye('currentPass',this)" type="button">👁️</button>
</div>
<label style="font-size:11px;color:var(--muted);margin-top:12px;display:block">NEW PASSWORD</label>
<div class="pass-wrap">
<input id="newPass" type="password" class="input" placeholder="New password">
<button class="eye" onclick="toggleEye('newPass',this)" type="button">👁️</button>
</div>
<label style="font-size:11px;color:var(--muted);margin-top:12px;display:block">CONFIRM NEW PASSWORD</label>
<div class="pass-wrap">
<input id="confirmPass" type="password" class="input" placeholder="Confirm">
<button class="eye" onclick="toggleEye('confirmPass',this)" type="button">👁️</button>
</div>
<button class="btn" style="width:100%;margin-top:14px;padding:13px" onclick="changePassword()">Change Password → Save</button>
<div id="passMsg"></div>
</div>
<div style="margin-top:14px;padding:12px;background:#121116;border-radius:12px;border:1px solid var(--line)">
<p style="font-size:11px;color:var(--muted)">✅ Password stored securely<br>✅ Only you can change it<br>✅ No hints displayed</p>
<button class="btn btn-dark" style="margin-top:8px;font-size:11px" onclick="resetToDefault()">Reset to default</button>
</div>
</div>
</div>
</div>
</div>
</div>

<script>
let poems=JSON.parse(localStorage.getItem('paul_poems_v3')||'null')||[
{id:1,title:"How I Remember You",mood:"Most Loved ❤",likes:24,body:"Not in the big moments,\nbut in the small ones."},
{id:2,title:"If Love Had a Voice",mood:"Romantic • 2 AM",likes:18,body:"If love had a voice,\nit would sound like your name\nat 2 AM"},
{id:3,title:"The Coffee Gets Cold",mood:"Deep Love",likes:31,body:"I make coffee for two,\neven when you're not here."},
{id:4,title:"In Small Letters",mood:"Poets' Favorite",likes:42,body:"I don't need you\nto shout my name\nfrom rooftops."}
];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return 'h_'+h;}
const DEFAULT_HASH="h_-1891246364";
function getActiveHash(){return localStorage.getItem('paul_custom_hash')||DEFAULT_HASH;}
function toggleEye(id,btn){
let input=document.getElementById(id);
if(input.type==="password"){input.type="text";btn.textContent="🙈";}else{input.type="password";btn.textContent="👁️";}
}
function login(){
let p=document.getElementById('passInput').value;
if(hash(p)===getActiveHash()){
localStorage.setItem('paul_logged','yes');
showApp();
} else {
document.getElementById('loginError').style.display='block';
}
}
function showApp(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderPoems();}
function logout(){localStorage.removeItem('paul_logged');location.reload();}
function showTab(n){document.querySelectorAll('[id^=tab-]').forEach(e=>e.classList.add('hidden'));document.getElementById('tab-'+n).classList.remove('hidden');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+n).classList.add('active');}
function renderPoems(){let q=(document.getElementById('searchPoems').value||'').toLowerCase();let list=document.getElementById('poemList');list.innerHTML='';poems.filter(p=>p.title.toLowerCase().includes(q)).forEach(p=>{let div=document.createElement('div');div.className='poem-row';div.innerHTML=`<b>${p.title}</b> <span style="font-size:10px;color:var(--muted)">${p.mood} • 💓 ${p.likes}</span><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-dark" style="font-size:11px" onclick="editPoem(${p.id})">Edit</button><button class="btn btn-dark" style="font-size:11px" onclick="deletePoem(${p.id})">Delete</button></div>`;list.appendChild(div);});}
function savePoem(){let id=document.getElementById('editId').value;let title=document.getElementById('newTitle').value.trim();let mood=document.getElementById('newMood').value;let body=document.getElementById('newBody').value.trim();let likes=parseInt(document.getElementById('newLikes').value)||0;if(!title||!body){alert('Add title and body');return;}if(id){let p=poems.find(x=>x.id==id);p.title=title;p.mood=mood;p.body=body;p.likes=likes;}else{let newId=poems.length?Math.max(...poems.map(p=>p.id))+1:1;poems.push({id:newId,title,mood,body,likes});}localStorage.setItem('paul_poems_v3',JSON.stringify(poems));clearForm();renderPoems();alert('Saved!');}
function editPoem(id){let p=poems.find(x=>x.id===id);document.getElementById('editId').value=p.id;document.getElementById('newTitle').value=p.title;document.getElementById('newMood').value=p.mood;document.getElementById('newBody').value=p.body;document.getElementById('newLikes').value=p.likes;showTab('add');}
function deletePoem(id){if(confirm('Delete?')){poems=poems.filter(p=>p.id!==id);localStorage.setItem('paul_poems_v3',JSON.stringify(poems));renderPoems();}}
function clearForm(){document.getElementById('editId').value='';document.getElementById('newTitle').value='';document.getElementById('newBody').value='';}
function changePassword(){
let curr=document.getElementById('currentPass').value;
let newP=document.getElementById('newPass').value;
let conf=document.getElementById('confirmPass').value;
let msg=document.getElementById('passMsg');
if(hash(curr)!==getActiveHash()){msg.innerHTML='<div class="alert alert-error">❌ Current password wrong!</div>';return;}
if(newP.length<4){msg.innerHTML='<div class="alert alert-error">❌ Too short - min 4 chars</div>';return;}
if(newP!==conf){msg.innerHTML='<div class="alert alert-error">❌ Passwords do not match!</div>';return;}
localStorage.setItem('paul_custom_hash',hash(newP));
msg.innerHTML='<div class="alert alert-success">✅ Password changed!</div>';
document.getElementById('currentPass').value='';document.getElementById('newPass').value='';document.getElementById('confirmPass').value='';
}
function resetToDefault(){
if(confirm('Reset to default password?')){
localStorage.removeItem('paul_custom_hash');
document.getElementById('passMsg').innerHTML='<div class="alert alert-success">✅ Reset to default password</div>';
}
}
if(localStorage.getItem('paul_logged')==='yes'){showApp();}
</script>
</body>
                                                                         </html>

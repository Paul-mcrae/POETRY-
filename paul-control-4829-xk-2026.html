<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paul Secure + Live Watch</title><style>body{background:#000;color:#fff;font-family:sans-serif;padding:16px}h1{color:#f5c518;text-align:center}#lock{max-width:400px;margin:80px auto;text-align:center;background:#111;border:1px solid #333;padding:28px;border-radius:20px}#dash{display:none;max-width:650px;margin:auto}.box{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px 0}input,textarea{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;padding:14px 70px 14px 14px;border-radius:12px;margin:8px 0;font-size:16px;box-sizing:border-box}textarea{height:200px;padding-right:14px}.btn{background:#f5c518;color:#000;border:0;padding:14px;border-radius:30px;font-weight:900;width:100%;margin-top:12px;cursor:pointer}.rel{position:relative;display:flex;align-items:center}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#333;border:0;width:60px;height:38px;border-radius:20px;font-size:12px;font-weight:900;color:#f5c518;cursor:pointer}.poem{background:#0a0a0a;border:1px solid #222;padding:12px;border-radius:12px;margin:8px 0}.ok{color:#0f0;text-align:center;padding:10px;border:1px solid #0f0;border-radius:10px;margin-top:10px}.err{color:#f55;text-align:center;padding:10px;border:1px solid #f55;border-radius:10px;margin-top:10px}.small{color:#777;font-size:11px;text-align:center}.change{background:#1a1a1a;color:#f5c518;border:1px solid #444;padding:10px 14px;border-radius:20px;font-size:13px;margin:8px 4px;cursor:pointer;font-weight:700}</style></head><body>

<script>
function toggleEye(a,b){let p=document.getElementById(a),x=document.getElementById(b);if(p.type==='password'){p.type='text';x.innerText='HIDE';x.style.background='#f5c518';x.style.color='#000'}else{p.type='password';x.innerText='SHOW';x.style.background='#333';x.style.color='#f5c518'}}
const fullDefault=[["THE COFFEE WE SHARE","I wake before the kettle sings your name,\nThe kitchen cold without your sleepy light,\nI measure two spoons just the same,\nOne strong for you, one soft and light,\nAnd wait to hear your morning feet.\n\nYou shuffle in, your hair a tangled crown,\nYour hoodie falling off one sleepy shoulder,\nYou steal my mug and never put it down,\nYou say I'm cold but pull me closer,\nAnd suddenly the day is warmer."],["HOW YOU FOLD MY SHIRTS","You fold my shirts like you mean it,\nNot perfect, but with care in each crease,\nSleeves tucked in, buttons hiding,\nAs if you're telling them peace,\nStay here, he will be back."],["YOUR KEYS ON MY TABLE","Your keys land loud on my table,\nA jingle that means you are home,\nNo knock, no text, no fable,\nJust metal music, you have roamed,\nBack to where you belong."],["GROCERY LIST LOVE","We write our grocery list on the back of bills,\nYour handwriting big, mine cramped and small,\nMilk, bread, eggs, and your little frills,\nChocolate that you say is for us all,\nBut I know you buy it for me."],["WE COOK UGLY RICE","We cook rice that always sticks a bit,\nYou say it's my heat, I say it's your pot,\nWe both are right, we both admit,\nThat perfect rice we have not,\nBut perfect evenings we have."],["THE DISHES AT MIDNIGHT","We do dishes at midnight again,\nBecause we procrastinated all day,\nPlates stacked like our maybe and when,\nSoaked in water turning grey,\nWaiting for us to face them."],["NIGHT BUS YOUR HEAD ON MY SHOULDER","The night bus smells of diesel and day-old sweat,\nWe take it because taxi is too dear,\nYour head finds my shoulder, heavy, yet,\nLight as permission to be near,\nIn public, unashamed."],["YOUR UMBRELLA IS TOO SMALL","Your umbrella is too small for two,\nWe walk like crabs, shoulder to shoulder,\nYou tilt it to my side, I tilt to you,\nWe both get wet, just colder,\nBut never let go to stay dry."],["HOW YOU STEAL MY HOODIE","You steal my hoodie every cold morning,\nNot asking, just wearing it like it's yours,\nYou say it smells better in your adorning,\nThan in my closet behind closed doors,\nAnd you are right, it does."],["THE WAY YOU CHARGE MY PHONE","My phone dies always at eleven percent,\nYou roll your eyes and plug it in,\nYou say I live too loud, too spent,\nAnd never let the low light win,\nYou charge my chaos with your calm."]];
let poems=JSON.parse(localStorage.getItem('my_poems_best')||"[]");const REPO="paul-mcrae/POETRY-";const FILE="index.html";
function getPass(){return localStorage.getItem('paul_pass')||'Charles'}
function unlock(){let p=document.getElementById('pass').value.trim();if(p===getPass()){document.getElementById('lock').style.display='none';document.getElementById('dash').style.display='block';checkToken();render();document.getElementById('pass').value='';}else{document.getElementById('msg').innerHTML='<div class="err">❌ Wrong password!</div>';}}
function changePass(){let o=prompt('Current password:');if(o===null)return;if(o!==getPass()){alert('❌ Wrong current!');return;}let n=prompt('New password (your choice):');if(n===null)return;if(n.trim().length<3){alert('Too short');return;}localStorage.setItem('paul_pass',n.trim());alert('✅ Changed! New: '+n.trim());}
function resetPass(){if(!confirm('Reset to Charles?'))return;localStorage.setItem('paul_pass','Charles');alert('Reset to Charles');}
function saveToken(){let t=document.getElementById('token').value.trim();if(!t.startsWith('ghp_')){alert('Must ghp_');return}localStorage.setItem('gh_token',t);document.getElementById('tokenStatus').innerText='✅ Saved';document.getElementById('token').value='';checkToken()}
function checkToken(){let t=localStorage.getItem('gh_token');document.getElementById('tokenStatus').innerText=t?'✅ Token ready':'❌ No token'}
function render(){document.getElementById('list').innerHTML=poems.map((p,i)=>`<div class="poem"><b>${p[0]}</b><br><small style="color:#888">${p[1].substring(0,80).replace(/</g,'&lt;')}...</small><br><button style="background:#222;color:#f55;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:12px;width:auto;margin-top:6px" onclick="delPoem(${i})">❌ Delete</button></div>`).join('')||'<p class="small">Click RESTORE!</p>';document.getElementById('count').innerText=poems.length;localStorage.setItem('my_poems_best',JSON.stringify(poems))}
function restoreFull(){poems=[...fullDefault];render();document.getElementById('restoreMsg').innerHTML='<div class="ok">✅ Restored 10 poems!</div>';}
async function getFile(){let token=localStorage.getItem('gh_token');let r=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{headers:{Authorization:`token ${token}`}});if(!r.ok)throw new Error('Token bad');return await r.json()}
function buildHTML(a){return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PAUL POETRY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui,sans-serif}header{background:#111;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}header b span{color:#f5c518}.wa{background:#f5c518;color:#000;padding:10px 18px;border-radius:30px;text-decoration:none;font-weight:800;font-size:13px}.live-watch{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);border:1px solid #f5c518;border-radius:16px;padding:14px;margin:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 15px rgba(245,197,24,.15)}.live-watch .left{display:flex;flex-direction:column}.live-watch .time{font-size:28px;font-weight:900;color:#f5c518;letter-spacing:1px;font-variant-numeric:tabular-nums}.live-watch .date{font-size:12px;color:#aaa;margin-top:4px}.live-watch .right{text-align:right}.live-watch .dot{display:inline-block;width:8px;height:8px;background:#0f0;border-radius:50%;animation:blink 1s infinite;margin-right:6px}.live-watch .live{font-size:11px;color:#0f0;font-weight:800;letter-spacing:1px}.live-watch .place{font-size:11px;color:#888;margin-top:4px}@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.grid img{width:100%;height:180px;object-fit:cover;border-radius:16px;transition:1s}.title{padding:20px 16px 8px;font-size:24px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.title span{font-size:12px;color:#f5c518;background:#1a1a1a;border:1px solid #333;padding:6px 12px;border-radius:20px}.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px;animation:fade .4s}.card h3{color:#f5c518;margin-bottom:8px;font-size:16px}.card p{white-space:pre-line;line-height:1.6;color:#ddd;font-size:14px}.card p.short{max-height:75px;overflow:hidden;position:relative}.card p.short:after{content:"";position:absolute;bottom:0;left:0;right:0;height:35px;background:linear-gradient(transparent,#121212)}.card p.full{max-height:none}.read{color:#f5c518;background:none;border:1px solid #444;padding:7px 14px;border-radius:20px;margin-top:10px;cursor:pointer;font-size:13px;font-weight:700}.acts{display:flex;gap:8px;margin-top:12px;border-top:1px solid #222;padding-top:10px}.acts button{background:#222;border:1px solid #333;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px;cursor:pointer}.acts button.liked{background:#f5c518;color:#000}.cbox{display:none;margin-top:10px;background:#0a0a0a;padding:10px;border-radius:10px;border:1px solid #222}.cbox.on{display:block}.cbox input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:9px;border-radius:8px}.citem{background:#222;padding:7px 10px;border-radius:8px;margin-top:6px;font-size:13px}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}footer{text-align:center;padding:24px;color:#555;font-size:11px;border-top:1px solid #111;margin-top:20px}</style></head><body><header><b><span>PAUL</span> POETRY</b><a class="wa" href="https://wa.me/256709478798">WhatsApp Me</a></header><div class="live-watch"><div class="left"><div class="time" id="clock">00:00:00</div><div class="date" id="date">Loading...</div></div><div class="right"><div><span class="dot"></span><span class="live">LIVE</span></div><div class="place">📍 Kampala, UG</div><div class="place" id="sec" style="color:#f5c518;font-weight:800">--</div></div></div><div class="grid" id="g"><img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"><img src="https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800"><img src="https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=800"></div><div class="title">Latest Poems 🔥 <span id="poemCount">10 poems</span></div><div id="poems"></div><footer>© 2026 PAUL POETRY • Live from Kampala • <span id="footerTime"></span></footer><script>const poems=${JSON.stringify(a)};document.getElementById("poemCount").innerText=poems.length+" poems";let h="";poems.forEach((p,i)=>{let long=p[1].length>150;h+=\`<div class="card"><h3>\${p[0].replace(/</g,"&lt;")}</h3><p id="t\${i}" class="\${long?"short":""}">\${p[1].replace(/</g,"&lt;")}</p>\${long?\`<button class="read" onclick="let e=document.getElementById('t\${i}');e.classList.toggle('full');e.classList.toggle('short');this.innerText=e.classList.contains('full')?'Show less ↑':'Read full poem →'">Read full poem →</button>\`:""}<div class="acts"><button id="l\${i}" onclick="like(\${i})">❤️ <span id="c\${i}">0</span> Like</button><button onclick="share(\${i})">↗️ Share</button><button onclick="document.getElementById('cb\${i}').classList.toggle('on')">💬 Comment</button></div><div class="cbox" id="cb\${i}"><input placeholder="Write comment + Enter" onkeydown="if(event.key==='Enter'){add(\${i},this.value);this.value=''}"><div id="d\${i}"></div></div></div>\`});document.getElementById("poems").innerHTML=h;function like(i){let L=JSON.parse(localStorage.likes||"{}");L[i]=(L[i]||0)+1;localStorage.likes=JSON.stringify(L);document.getElementById("c"+i).innerText=L[i];document.getElementById("l"+i).classList.add("liked")}function share(i){let t=poems[i][0]+" - Paul Poetry https://paul-mcrae.github.io/POETRY-/";window.open("https://wa.me/?text="+encodeURIComponent(t))}function add(i,v){if(!v.trim())return;let C=JSON.parse(localStorage.comments||"{}");if(!C[i])C[i]=[];C[i].push(v);localStorage.comments=JSON.stringify(C);show(i)}function show(i){let C=JSON.parse(localStorage.comments||"{}");let d=document.getElementById("d"+i);if(C[i])d.innerHTML=C[i].map(x=>\`<div class="citem">💬 \${x.replace(/</g,"&lt;")}</div>\`).join("")}let L=JSON.parse(localStorage.likes||"{}");Object.keys(L).forEach(i=>{let e=document.getElementById("c"+i);if(e)e.innerText=L[i]});let C=JSON.parse(localStorage.comments||"{}");Object.keys(C).forEach(i=>show(i));function updateClock(){let now=new Date();let opts={timeZone:'Africa/Kampala'};let timeStr=now.toLocaleTimeString('en-GB',{timeZone:'Africa/Kampala',hour12:false});let dateStr=now.toLocaleDateString('en-GB',{timeZone:'Africa/Kampala',weekday:'long',year:'numeric',month:'long',day:'numeric'});let sec=now.toLocaleTimeString('en-GB',{timeZone:'Africa/Kampala',hour12:false}).split(':')[2];document.getElementById("clock").innerText=timeStr;document.getElementById("date").innerText=dateStr;document.getElementById("sec").innerText=sec+" seconds";document.getElementById("footerTime").innerText=timeStr+" EAT";}updateClock();setInterval(updateClock,1000);const pool=["https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800","https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800","https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800","https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=800","https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"];setInterval(()=>{document.querySelectorAll("#g img").forEach(img=>{let r=pool[Math.floor(Math.random()*pool.length)];img.style.opacity=0;setTimeout(()=>{img.src=r;img.style.opacity=1},600)})},60000);<\/script></body></html>`;}
async function addAuto(){let token=localStorage.getItem('gh_token');if(!token){alert('Need token');return}let t=document.getElementById('title').value.trim(),tx=document.getElementById('text').value.trim();if(t&&tx)poems.unshift([t,tx]);document.getElementById('status').innerHTML='⏳ Adding Live Watch site...';document.getElementById('addBtn').disabled=true;let html=buildHTML(poems);try{let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Live watch`,content:content,sha:file.sha})});if(res.ok){document.getElementById('status').innerHTML='<div class="ok">✅ LIVE! With Live Watch ⌚ Outstanding!</div>';document.getElementById('title').value='';document.getElementById('text').value='';render()}else{let e=await res.text();document.getElementById('status').innerHTML=`<div class="err">${e.substring(0,250)}</div>`}}catch(e){document.getElementById('status').innerHTML=`<div class="err">${e.message}</div>`}document.getElementById('addBtn').disabled=false}
async function delPoem(i){if(!confirm('Delete?'))return;let token=localStorage.getItem('gh_token');let backup=[...poems];poems.splice(i,1);render();let html=buildHTML(poems);try{let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Del`,content:content,sha:file.sha})});if(res.ok)document.getElementById('status').innerHTML='<div class="ok">✅ Deleted!</div>';else{poems=backup;render()}}catch(e){poems=backup;render()}}
</script></body></html>

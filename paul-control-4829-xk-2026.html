<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paul Secure Control</title><style>body{background:#000;color:#fff;font-family:sans-serif;padding:16px}h1{color:#f5c518;text-align:center}#lock{max-width:400px;margin:80px auto;text-align:center;background:#111;border:1px solid #333;padding:28px;border-radius:20px;box-shadow:0 0 20px rgba(245,197,24,.15)}#dash{display:none;max-width:650px;margin:auto}.box{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px 0}input,textarea{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;padding:14px 70px 14px 14px;border-radius:12px;margin:8px 0;font-size:16px;box-sizing:border-box}textarea{height:200px;padding-right:14px}.btn{background:#f5c518;color:#000;border:0;padding:14px;border-radius:30px;font-weight:900;width:100%;margin-top:12px;cursor:pointer;font-size:16px}.rel{position:relative;display:flex;align-items:center}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#333;border:0;width:60px;height:38px;border-radius:20px;font-size:12px;font-weight:900;color:#f5c518;cursor:pointer;letter-spacing:.5px}.poem{background:#0a0a0a;border:1px solid #222;padding:12px;border-radius:12px;margin:8px 0}.ok{color:#0f0;text-align:center;padding:10px;border:1px solid #0f0;border-radius:10px;margin-top:10px}.err{color:#f55;text-align:center;padding:10px;border:1px solid #f55;border-radius:10px;margin-top:10px}.small{color:#777;font-size:11px;text-align:center;margin-top:8px}.change{background:#1a1a1a;color:#f5c518;border:1px solid #444;padding:10px 14px;border-radius:20px;font-size:13px;margin:8px 4px;cursor:pointer;font-weight:700}</style></head><body>
<div id="lock"><h2 style="color:#f5c518">PAUL CONTROL 🔒</h2><p class="small" style="color:#aaa">Secure Dashboard</p>
<div class="rel"><input id="pass" type="password" placeholder="Enter Password"><button class="eye" id="eyePass" onclick="toggleEye('pass','eyePass')">SHOW</button></div>
<button class="btn" onclick="unlock()">Unlock Dashboard</button>
<div style="margin-top:16px;display:flex;justify-content:center;flex-wrap:wrap"><button class="change" onclick="changePass()">🔑 Change My Password</button><button class="change" onclick="resetPass()" style="color:#888">Reset</button></div>
<p id="msg"></p><p class="small">Default: Charles (first time only)<br>After you change, your new password is secret</p></div>

<div id="dash"><h1>PAUL POETRY 🚀</h1>
<div class="box"><p class="small">GitHub Token:</p><div class="rel"><input id="token" type="password" placeholder="Paste ghp_xxxx"><button class="eye" id="eyeToken" onclick="toggleEye('token','eyeToken')">SHOW</button></div><button class="btn" style="background:#222;color:#fff" onclick="saveToken()">Save Token</button><p id="tokenStatus" class="small"></p></div>
<div class="box" style="border-color:#f5c518"><button class="btn" onclick="restoreFull()">🔄 RESTORE 10 FULL POEMS</button><p id="restoreMsg"></p></div>
<div class="box"><input id="title" placeholder="Poem Title"><textarea id="text" placeholder="Long poem..."></textarea><button id="addBtn" class="btn" onclick="addAuto()">+ ADD TO WEBSITE 🌍</button><p id="status"></p></div>
<div class="box"><h3 style="color:#f5c518">Your Poems: <span id="count">0</span></h3><div id="list"></div></div>
<div class="box" style="text-align:center"><button class="change" onclick="changePass()" style="width:100%">🔑 Change Dashboard Password Anytime</button><p class="small">You can change password whenever you feel like</p></div>
<p style="text-align:center"><a href="https://paul-mcrae.github.io/POETRY-/" style="color:#f5c518">→ View Live Website</a></p></div>

<script>
function toggleEye(inputId,btnId){let p=document.getElementById(inputId),b=document.getElementById(btnId);if(p.type==='password'){p.type='text';b.innerText='HIDE';b.style.background='#f5c518';b.style.color='#000'}else{p.type='password';b.innerText='SHOW';b.style.background='#333';b.style.color='#f5c518'}}
const fullDefault=[["THE COFFEE WE SHARE","I wake before the kettle sings your name,\nThe kitchen cold without your sleepy light,\nI measure two spoons just the same,\nOne strong for you, one soft and light,\nAnd wait to hear your morning feet.\n\nYou shuffle in, your hair a tangled crown,\nYour hoodie falling off one sleepy shoulder,\nYou steal my mug and never put it down,\nYou say I'm cold but pull me closer,\nAnd suddenly the day is warmer."],["HOW YOU FOLD MY SHIRTS","You fold my shirts like you mean it,\nNot perfect, but with care in each crease,\nSleeves tucked in, buttons hiding,\nAs if you're telling them peace,\nStay here, he will be back."],["YOUR KEYS ON MY TABLE","Your keys land loud on my table,\nA jingle that means you are home,\nNo knock, no text, no fable,\nJust metal music, you have roamed,\nBack to where you belong."],["GROCERY LIST LOVE","We write our grocery list on the back of bills,\nYour handwriting big, mine cramped and small,\nMilk, bread, eggs, and your little frills,\nChocolate that you say is for us all,\nBut I know you buy it for me."],["WE COOK UGLY RICE","We cook rice that always sticks a bit,\nYou say it's my heat, I say it's your pot,\nWe both are right, we both admit,\nThat perfect rice we have not,\nBut perfect evenings we have."],["THE DISHES AT MIDNIGHT","We do dishes at midnight again,\nBecause we procrastinated all day,\nPlates stacked like our maybe and when,\nSoaked in water turning grey,\nWaiting for us to face them."],["NIGHT BUS YOUR HEAD ON MY SHOULDER","The night bus smells of diesel and day-old sweat,\nWe take it because taxi is too dear,\nYour head finds my shoulder, heavy, yet,\nLight as permission to be near,\nIn public, unashamed."],["YOUR UMBRELLA IS TOO SMALL","Your umbrella is too small for two,\nWe walk like crabs, shoulder to shoulder,\nYou tilt it to my side, I tilt to you,\nWe both get wet, just colder,\nBut never let go to stay dry."],["HOW YOU STEAL MY HOODIE","You steal my hoodie every cold morning,\nNot asking, just wearing it like it's yours,\nYou say it smells better in your adorning,\nThan in my closet behind closed doors,\nAnd you are right, it does."],["THE WAY YOU CHARGE MY PHONE","My phone dies always at eleven percent,\nYou roll your eyes and plug it in,\nYou say I live too loud, too spent,\nAnd never let the low light win,\nYou charge my chaos with your calm."]];
let poems=JSON.parse(localStorage.getItem('my_poems_best')||"[]");const REPO="paul-mcrae/POETRY-";const FILE="index.html";
function getPass(){return localStorage.getItem('paul_pass')||'Charles'}
function unlock(){let p=document.getElementById('pass').value.trim();if(p===getPass()){document.getElementById('lock').style.display='none';document.getElementById('dash').style.display='block';checkToken();render();document.getElementById('pass').value='';}else{document.getElementById('msg').innerHTML='<div class="err">❌ Wrong password! Try again</div>';}}
function changePass(){let oldP=prompt('Enter CURRENT password to confirm:');if(oldP===null)return;if(oldP!==getPass()){alert('❌ Current password wrong!');return;}let n=prompt('Enter NEW password (your choice):');if(n===null)return;if(n.trim().length<3){alert('Too short! Min 3 letters');return;}localStorage.setItem('paul_pass',n.trim());alert('✅ Password changed! Your new password is now: '+n.trim()+'\n\nRemember it! Next time unlock with new one.');}
function resetPass(){if(!confirm('Reset to default Charles? You can then change again.'))return;localStorage.setItem('paul_pass','Charles');alert('✅ Reset to Charles. Now login with Charles and change to your own.');}
function saveToken(){let t=document.getElementById('token').value.trim();if(!t.startsWith('ghp_')){alert('Must start ghp_');return}localStorage.setItem('gh_token',t);document.getElementById('tokenStatus').innerText='✅ Token saved';document.getElementById('token').value='';checkToken()}
function checkToken(){let t=localStorage.getItem('gh_token');document.getElementById('tokenStatus').innerText=t?'✅ Token ready':'❌ No token'}
function render(){document.getElementById('list').innerHTML=poems.map((p,i)=>`<div class="poem"><div><b>${p[0]}</b><br><small style="color:#888">${p[1].substring(0,80).replace(/</g,'&lt;')}...</small></div><div style="margin-top:8px"><button style="background:#222;color:#f55;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:12px;width:auto" onclick="delPoem(${i})">❌ Delete</button></div></div>`).join('')||'<p class="small">Click RESTORE!</p>';document.getElementById('count').innerText=poems.length;localStorage.setItem('my_poems_best',JSON.stringify(poems))}
function restoreFull(){poems=[...fullDefault];render();document.getElementById('restoreMsg').innerHTML='<div class="ok">✅ Restored!</div>';}
async function getFile(){let token=localStorage.getItem('gh_token');let r=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{headers:{Authorization:`token ${token}`}});if(!r.ok)throw new Error('Token bad');return await r.json()}
function buildHTML(a){return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PAUL POETRY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif}header{background:#111;padding:14px;display:flex;justify-content:space-between;align-items:center}header b span{color:#f5c518}.wa{background:#f5c518;color:#000;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:800;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.grid img{width:100%;height:180px;object-fit:cover;border-radius:16px}.title{padding:24px 16px 8px;font-size:26px;font-weight:900}.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px}.card h3{color:#f5c518;margin-bottom:8px}.card p{white-space:pre-line;line-height:1.6;color:#ddd;font-size:14px}.card p.short{max-height:75px;overflow:hidden;position:relative}.card p.short:after{content:"";position:absolute;bottom:0;left:0;right:0;height:35px;background:linear-gradient(transparent,#121212)}.card p.full{max-height:none}.read{color:#f5c518;background:none;border:1px solid #333;padding:6px 12px;border-radius:20px;margin-top:8px;cursor:pointer;font-size:13px}.acts{display:flex;gap:10px;margin-top:12px;border-top:1px solid #222;padding-top:10px}.acts button{background:#222;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}.acts button.liked{background:#f5c518;color:#000}.cbox{display:none;margin-top:10px;background:#111;padding:10px;border-radius:10px}.cbox.on{display:block}.cbox input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:8px;border-radius:8px}.citem{background:#222;padding:6px 8px;border-radius:8px;margin-top:6px;font-size:13px}</style></head><body><header><b><span>PAUL</span> POETRY</b><a class="wa" href="https://wa.me/256709478798">WhatsApp Me</a></header><div class="grid" id="g"><img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"><img src="https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"></div><div class="title">Latest Poems 🔥</div><div id="poems"></div><script>const poems=${JSON.stringify(a)};let h="";poems.forEach((p,i)=>{let long=p[1].length>150;h+=\`<div class="card"><h3>\${p[0].replace(/</g,"&lt;")}</h3><p id="t\${i}" class="\${long?"short":""}">\${p[1].replace(/</g,"&lt;")}</p>\${long?\`<button class="read" onclick="let e=document.getElementById('t\${i}');e.classList.toggle('full');e.classList.toggle('short');this.innerText=e.classList.contains('full')?'Show less ↑':'Read full poem →'">Read full poem →</button>\`:""}<div class="acts"><button id="l\${i}" onclick="like(\${i})">❤️ <span id="c\${i}">0</span> Like</button><button onclick="share(\${i})">↗️ Share</button><button onclick="document.getElementById('cb\${i}').classList.toggle('on')">💬 Comment</button></div><div class="cbox" id="cb\${i}"><input placeholder="Write comment + Enter" onkeydown="if(event.key==='Enter'){add(\${i},this.value);this.value=''}"><div id="d\${i}"></div></div></div>\`});document.getElementById("poems").innerHTML=h;function like(i){let L=JSON.parse(localStorage.likes||"{}");L[i]=(L[i]||0)+1;localStorage.likes=JSON.stringify(L);document.getElementById("c"+i).innerText=L[i];document.getElementById("l"+i).classList.add("liked")}function share(i){let t=poems[i][0]+" - Paul Poetry https://paul-mcrae.github.io/POETRY-/";window.open("https://wa.me/?text="+encodeURIComponent(t))}function add(i,v){let C=JSON.parse(localStorage.comments||"{}");if(!C[i])C[i]=[];C[i].push(v);localStorage.comments=JSON.stringify(C);show(i)}function show(i){let C=JSON.parse(localStorage.comments||"{}");let d=document.getElementById("d"+i);if(C[i])d.innerHTML=C[i].map(x=>\`<div class="citem">💬 \${x.replace(/</g,"&lt;")}</div>\`).join("")}let L=JSON.parse(localStorage.likes||"{}");Object.keys(L).forEach(i=>{let e=document.getElementById("c"+i);if(e)e.innerText=L[i]});let C=JSON.parse(localStorage.comments||"{}");Object.keys(C).forEach(i=>show(i));<\/script></body></html>`;}
async function addAuto(){let token=localStorage.getItem('gh_token');if(!token){alert('Need token');return}let t=document.getElementById('title').value.trim(),tx=document.getElementById('text').value.trim();if(t&&tx)poems.unshift([t,tx]);document.getElementById('status').innerHTML='⏳ Updating...';document.getElementById('addBtn').disabled=true;let html=buildHTML(poems);try{let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Update`,content:content,sha:file.sha})});if(res.ok){document.getElementById('status').innerHTML='<div class="ok">✅ LIVE!</div>';document.getElementById('title').value='';document.getElementById('text').value='';render()}else{let e=await res.text();document.getElementById('status').innerHTML=`<div class="err">${e.substring(0,300)}</div>`}}catch(e){document.getElementById('status').innerHTML=`<div class="err">${e.message}</div>`}document.getElementById('addBtn').disabled=false}
async function delPoem(i){if(!confirm('Delete?'))return;let token=localStorage.getItem('gh_token');let backup=[...poems];poems.splice(i,1);render();let html=buildHTML(poems);try{let file=await getFile();let content=btoa(unescape(encodeURIComponent(html)));let res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Del`,content:content,sha:file.sha})});if(res.ok)document.getElementById('status').innerHTML='<div class="ok">✅ Deleted!</div>';else{poems=backup;render()}}catch(e){poems=backup;render()}}
</script></body></html>

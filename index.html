{title:"THE COFFEE WE SHARE",text:`I wake before the kettle sings your name,
The kitchen cold without your sleepy light,
I measure two spoons just the same,
One strong for you, one soft and light,
And wait to hear your morning feet.

You shuffle in, your hair a tangled crown,
Your hoodie falling off one sleepy shoulder,
You steal my mug and never put it down,
You say I'm cold but pull me closer,
And suddenly the day is warmer.

We don't talk much before eight o'clock,
We let the steam do all the speaking,
Your knee against mine beneath the table,
My phone face-down, my heart still peaking,
At how you look when you're half-dreaming.

I watch you butter toast like art,
Too much on one side, barely on the other,
You cut it diagonal, straight from the heart,
You feed me first, like you always bother,
To make me feel first, even in small things.

Later the sink holds two spoons, two cups,
A quiet proof that you were here,
I wash them slow, don't rush it up,
Because this ritual is my prayer,
That every morning starts with us.

Even when work calls and we must run,
You kiss the rim where my lips had been,
You say love you like it's already won,
I carry that taste till evening,
Coffee cold, but love still hot.

If someday we have bigger kitchens,
With island counters and fancy views,
I will still make it in this small tradition,
Two mugs mismatched, no time to choose,
Because love is not in perfect things.

So here's to our ordinary brew,
To sleepy eyes and shared caffeine,
To loving you in all I do,
To every morning in between,
Where daily life tastes like you.`},
{title:"HOW YOU FOLD MY SHIRTS",text:`You fold my shirts like you mean it,
Not perfect, but with care in each crease,
Sleeves tucked in, buttons hiding,
As if you're telling them peace,
Stay here, he will be back.

I never asked you to touch my laundry,
It was scattered like my thoughts before,
But you gathered socks like lost stories,
Pairing them on our bedroom floor,
And made chaos feel like home.

You complain that I leave pockets full,
Receipts and coins and little notes,
You empty them with a sigh so full,
Then read my day in what it wrote,
And smile at the life I live.

Sometimes you hold a shirt up to your face,
It still smells like my cologne and sweat,
You don't say why you pause in that space,
But I know love is in that quiet debt,
Of missing me even when I'm near.

I watch your hands move, efficient, soft,
Folding futures into cotton squares,
A simple act that lifts me aloft,
Because someone cares what I wear,
And how I face the world outside.

We never talk about love when you fold,
We talk about bills and who ate the last slice,
Yet in that laundry love is told,
Louder than any sacrifice,
Because you stay in the mundane.

When I put that shirt on tomorrow,
I will carry your fingerprints in seams,
Not visible, but felt like tomorrow,
Is stitched with all our quiet dreams,
Of a life where we both belong.

And if one day these shirts grow old,
Faded, thin from years of wear,
I will still keep one you fold,
Unwashed, to hold when you're not there,
And remember how love folds time.`},
{title:"YOUR KEYS ON MY TABLE",text:`Your keys land loud on my table,
A jingle that means you are home,
No knock, no text, no fable,
Just metal music, you have roamed,
Back to where you belong.

They scratch my wood a little each time,
A small half-moon near the edge,
I should complain about that crime,
But that scratch is our pledge,
That you come home daily.

Sometimes you forget them inside,
And call me from downstairs, locked,
I run down, half-dressed in pride,
You kiss me quick, not shocked,
That I came running for keys.

Your keychain holds a faded photo,
Of us two years ago at the lake,
Plastic cracked from sun and snow,
But you never replace or fake,
Another, you keep us there.

I hear those keys at six fifteen,
Before I see your face at door,
That sound has become my routine,
The best part of day, before,
You even say hello.

Other people wait for fireworks,
I wait for keys on wood to clatter,
Because big loves do smaller works,
That make small moments matter,
More than grand arrivals.

So throw your keys as loud as you want,
Scratch my table, mark our time,
Every jingle is a nonchalant,
Way of saying you are mine,
And this table is ours.

If one day those keys don't come,
I will keep that scratch and listen,
For the ghost of a jingle hum,
Where our daily love has risen,
In the sound of you arriving.`},
{title:"GROCERY LIST LOVE",text:`We write our grocery list on the back of bills,
Your handwriting big, mine cramped and small,
Milk, bread, eggs, and your little frills,
Chocolate that you say is for us all,
But I know you buy it for me.

You add things we don't need but want,
Avocados that will ripen too fast,
Cookies that will be gone by haunt,
Of midnight cravings that never last,
Yet you add them anyway.

In the supermarket we disagree,
About which brand of tomato sauce,
You win always, because you plea,
With that look that shows no remorse,
And I pretend to be annoyed.

You push the cart like it's a car,
Taking corners sharp, me holding on,
People stare at how bizarre we are,
Two adults playing till we're gone,
Down the aisle of cleaning soap.

At checkout you pack heavy things,
Under light things, like you were taught,
I pack randomly, as chaos brings,
You repack mine without a thought,
And say I try, which is enough.

Carrying bags up three floors high,
You take two, I take one and complain,
You laugh and say I will not die,
From one bag in light rain,
And you are right, I won't.

On our kitchen floor the bags exhale,
We put away futures in a fridge,
Yogurt dates and stories we inhale,
Of a week we will live on this bridge,
Between shopping and loving.

And later when I taste that sauce,
I will taste the argument we had,
How you were right, of course, of course,
And how even shopping can be glad,
When I shop with you.`},
{title:"WE COOK UGLY RICE",text:`We cook rice that always sticks a bit,
You say it's my heat, I say it's your pot,
We both are right, we both admit,
That perfect rice we have not,
But perfect evenings we have.

You chop onions too big, I chop too small,
You cry, I laugh, we both are blind,
From onion tears that make us fall,
Into giggles of the kind,
That only kitchens know.

The stew is sometimes salty, sometimes bland,
We add water, add salt, add hope,
We taste from same spoon hand in hand,
And learn to somehow cope,
With flavors not quite right.

You burn garlic while I'm on a call,
The smoke alarm becomes our bell,
We open windows, laugh at all,
Our failed dinner, what the hell,
It still tastes like us.

We eat on the floor when table's full,
Of unopened mail and drying clothes,
You feed me rice that pulls,
And I feed you stories that expose,
How hungry I am for you.

No restaurant ever got it right,
Like our ugly, sticky, smoky rice,
Because they cook with skill so light,
We cook with love at twice,
The imperfection and twice the love.

When guests come we order out,
Ashamed of our kitchen art,
But when alone, we have no doubt,
That this is gourmet of the heart,
Where recipes are memories.

So let's keep cooking ugly rice,
Burning, sticking, over-salting,
Because every imperfect slice,
Of daily life is exalting,
When I cook it with you.`},
{title:"THE DISHES AT MIDNIGHT",text:`We do dishes at midnight again,
Because we procrastinated all day,
Plates stacked like our maybe and when,
Soaked in water turning grey,
Waiting for us to face them.

You wash, I rinse, we don't speak much,
Radio low playing old Swahili love,
Your elbow brushes mine with touch,
Not planned, but sent from above,
Of tired people still reaching.

You hate steel wool, it scratches hands,
I hate rinsing, it splashes shirt,
We trade jobs like shifting sands,
No score kept for who does hurt,
More, we just move.

A plate slips, doesn't break, just clinks,
We both freeze like parents of a child,
Then laugh because fate winks,
And doesn't break what's mild,
But loved, even plates.

We talk about people who have dishwashers,
How they must miss this midnight talk,
About neighbors, dreams, and washers,
That sing while we walk,
Through soap suds together.

By one a.m. the rack is full,
Shining wet in kitchen light,
We high-five with foam, so dull,
Yet so alive tonight,
Because clean plates feel like promise.

We leave kitchen light on for cockroaches,
Go to bed with hands wrinkled, clean,
Whispering about our approaches,
To tomorrow, what it means,
To do dishes at midnight again.

If love is dishes done at midnight,
When both are tired and could wait,
Then we are rich in love's dim light,
Not because dishes can't wait,
But because we do them together.`},
{title:"NIGHT BUS, YOUR HEAD ON MY SHOULDER",text:`The night bus smells of diesel and day-old sweat,
We take it because taxi is too dear,
Your head finds my shoulder, heavy, yet,
Light as permission to be near,
In public, unashamed.

You sleep with mouth slightly open wide,
People stare, I stare at you,
I adjust my shoulder to coincide,
With your dream, whatever you pursue,
Tonight on a crowded bus.

Your hand holds my elbow, not my hand,
As if elbow is more honest place,
A grip that says I understand,
You are tired, and this space,
Is enough to hold you.

We miss our stop because you snore,
Soft, a purr against my neck,
The conductor shouts once more,
We jolt awake, what the heck,
We laugh and walk extra.

Outside, your drool on my shirt remains,
A small wet map of where you slept,
I don't wipe it, I keep the stains,
Like medals you have kept,
Of trusting me in public.

Other couples need fancy cars,
We need a thirty-shilling bus ride,
With broken windows showing stars,
And you asleep at my side,
Which is more romantic?

So let's keep taking the late bus home,
When day has used up all our pay,
Let's keep this shoulder as your dome,
Where you can end your day,
And I can carry you home.

If life ever gives us cars and drivers,
I will still ask to take the bus,
Because some loves are survivors,
Not of luxury, but of us,
Asleep on shoulders, going home.`},
{title:"YOUR UMBRELLA IS TOO SMALL",text:`Your umbrella is too small for two,
We walk like crabs, shoulder to shoulder,
You tilt it to my side, I tilt to you,
We both get wet, just colder,
But never let go to stay dry.

You say you don't mind the rain on your arm,
I say I don't mind puddles in my shoe,
We lie so sweet about the charm,
Of being wet through and through,
If wet means we are close.

People under big umbrellas pass,
Dry, efficient, single file,
They look at us like we lack class,
We look at them and smile,
Because dry is lonely sometimes.

Your hair drips down your forehead line,
You look like a child caught in storm,
I tuck wet strands behind, divine,
In that moment, you transform,
Rain into baptism of us.

We arrive home soaked to the bone,
Shoes squeaking on our tiles,
You sneeze, I fetch towel, alone,
We laugh about our miles,
Walked under one small cover.

I could buy a bigger umbrella today,
Wide enough for two with space,
But I won't, I'll let it stay,
Small, so we must embrace,
Tighter when skies open.

So keep that tiny umbrella, love,
Don't replace it with sensible size,
Let it teach us from above,
That love is not being dry and wise,
But wet together, close.

And every rainy season here,
When clouds gather grey and tall,
I'll reach for you, not fear,
Your small umbrella after all,
Is big enough for us.`},
{title:"HOW YOU STEAL MY HOODIE",text:`You steal my hoodie every cold morning,
Not asking, just wearing it like it's yours,
You say it smells better in your adorning,
Than in my closet behind closed doors,
And you are right, it does.

It's too big for you, sleeves past hands,
You walk like a child in father's coat,
You say you feel safe where it lands,
On your small frame, like a boat,
Carrying you through cold.

I pretend to be annoyed, I say return,
You say finders keepers, lovers weepers,
I let you keep it, watch you turn,
Into someone who keepers,
Of my warmth, so near.

At night you sleep in that same hoodie,
Zipped up to chin, my scent on you,
I sleep colder but feel so moody,
Happy that my hoodie knew,
Your skin before mine did.

You wash it rarely, say washing removes,
The part that makes it yours and mine,
I argue hygiene disapproves,
You argue love has its own design,
That doesn't need detergent.

When people ask whose hoodie you wear,
You say yours, with no hesitation,
I smile because that is fair,
Love steals without explanation,
And calls it ownership.

So steal all my hoodies, take them all,
Leave me with t-shirts in July,
I will be cold but standing tall,
Because seeing you justify,
Theft with love is worth shivers.

And if one day we share a closet,
One rack for two, no more stealing,
I will miss this daily deposit,
Of you in my hoodie, revealing,
That you are always wearing me.`},
{title:"THE WAY YOU CHARGE MY PHONE",text:`My phone dies always at eleven percent,
You roll your eyes and plug it in,
You say I live too loud, too spent,
And never let the low light win,
You charge my chaos with your calm.

You place it on your side of the bed,
Screen down, so light won't wake your face,
Yet you leave enough cord to spread,
To my side, giving me space,
Even in small electric things.

I find it full at two a.m.,
When you are up to fetch water,
You charged it while I condemned,
The day for being shorter,
And you extended it for me.

It's not about battery or percent,
It's how you notice what I ignore,
You see my needs before they're spent,
And open silently a door,
Where love is practical and kind.

You don't make a big speech about it,
You just say "your phone" and slide it near,
No expectation, no counterfeit,
Just love translated clear,
In a hundred percent by morning.

Other people bring flowers sometimes,
You bring a full charge and a spare cable,
You bring solutions to my rhymes,
And make unstable stable,
With a plug against the wall.

If love is measured in small watts,
Then we are fully powered tonight,
Not by grand gestures or big thoughts,
But by a little glowing light,
That says I was thinking of you.

So keep plugging in my dying phone,
And I will keep plugging into you,
In every low-battery unknown,
I'll know what love will do,
It charges without asking.`}

function likePoem(i){
 let likes = JSON.parse(localStorage.getItem('likes')||'{}');
 likes[i] = (likes[i]||0)+1;
 localStorage.setItem('likes',JSON.stringify(likes));
 document.getElementById('like-count-'+i).innerText=likes[i];
 document.getElementById('like-'+i).classList.add('liked');
}
function sharePoem(i){
 const url = window.location.href;
 const text = poems[i].title + " - Paul Poetry: " + url;
 const wa = "https://wa.me/?text="+encodeURIComponent(text);
 window.open(wa,'_blank');
 if(navigator.share){ navigator.share({title:poems[i].title,text:text,url:url}); }
}
function toggleComments(i){
 document.getElementById('comments-'+i).classList.toggle('active');
}
function addComment(e,i){
 if(e.key==='Enter' && e.target.value.trim()!==''){
   let comments = JSON.parse(localStorage.getItem('comments')||'{}');
   if(!comments[i]) comments[i]=[];
   comments[i].push(e.target.value);
   localStorage.setItem('comments',JSON.stringify(comments));
   renderComments(i);
   e.target.value='';
 }
}
function renderComments(i){
 let comments = JSON.parse(localStorage.getItem('comments')||'{}');
 const list = document.getElementById('list-'+i);
 if(comments[i]) list.innerHTML = comments[i].map(c=>`<div class="comment-item">💬 ${c}</div>`).join('');
}
(function loadSaved(){
 let likes = JSON.parse(localStorage.getItem('likes')||'{}');
 let comments = JSON.parse(localStorage.getItem('comments')||'{}');
 Object.keys(likes).forEach(i=>{ if(document.getElementById('like-count-'+i)) document.getElementById('like-count-'+i).innerText=likes[i]; });
 Object.keys(comments).forEach(i=>renderComments(i));
})();

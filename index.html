<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PAUL POETRY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif}header{background:#111;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}header b span{color:#f5c518}.wa{background:#f5c518;color:#000;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:800;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.grid img{width:100%;height:180px;object-fit:cover;border-radius:16px;transition:1s}.title{padding:24px 16px 8px;font-size:26px;font-weight:900}.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px;animation:fade .5s}.card h3{color:#f5c518;margin-bottom:8px}.card p{white-space:pre-line;line-height:1.7;color:#ddd;font-size:14px}.card p.short{max-height:75px;overflow:hidden;position:relative}.card p.short:after{content:"";position:absolute;bottom:0;left:0;right:0;height:35px;background:linear-gradient(transparent,#121212)}.card p.full{max-height:none}.card p.full:after{display:none}.read{color:#f5c518;background:none;border:1px solid #444;padding:7px 14px;border-radius:20px;margin-top:10px;cursor:pointer;font-size:13px;font-weight:700}.acts{display:flex;gap:10px;margin-top:14px;border-top:1px solid #222;padding-top:12px}.acts button{background:#222;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}.acts button.liked{background:#f5c518;color:#000;border-color:#f5c518}.cbox{display:none;margin-top:12px;background:#0a0a0a;padding:12px;border-radius:12px;border:1px solid #222}.cbox.on{display:block}.cbox input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:10px;border-radius:10px}.citem{background:#222;padding:8px 10px;border-radius:10px;margin-top:8px;font-size:13px}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style></head><body><header><b><span>PAUL</span> POETRY</b><a class="wa" href="https://wa.me/256709478798">WhatsApp Me</a></header><div class="grid" id="g"><img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800"><img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"><img src="https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800"><img src="https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=800"></div><div class="title">Latest Poems 🔥</div><div id="poems"></div><script>const poems=[["THE COFFEE WE SHARE","I wake before the kettle sings your name,\nThe kitchen cold without your sleepy light,\nI measure two spoons just the same,\nOne strong for you, one soft and light,\nAnd wait to hear your morning feet.\n\nYou shuffle in, your hair a tangled crown,\nYour hoodie falling off one sleepy shoulder,\nYou steal my mug and never put it down,\nYou say I'm cold but pull me closer,\nAnd suddenly the day is warmer."],["HOW YOU FOLD MY SHIRTS","You fold my shirts like you mean it,\nNot perfect, but with care in each crease,\nSleeves tucked in, buttons hiding,\nAs if you're telling them peace,\nStay here, he will be back."],["YOUR KEYS ON MY TABLE","Your keys land loud on my table,\nA jingle that means you are home,\nNo knock, no text, no fable,\nJust metal music, you have roamed,\nBack to where you belong."],["GROCERY LIST LOVE","We write our grocery list on the back of bills,\nYour handwriting big, mine cramped and small,\nMilk, bread, eggs, and your little frills,\nChocolate that you say is for us all,\nBut I know you buy it for me."],["WE COOK UGLY RICE","We cook rice that always sticks a bit,\nYou say it's my heat, I say it's your pot,\nWe both are right, we both admit,\nThat perfect rice we have not,\nBut perfect evenings we have."],["THE DISHES AT MIDNIGHT","We do dishes at midnight again,\nBecause we procrastinated all day,\nPlates stacked like our maybe and when,\nSoaked in water turning grey,\nWaiting for us to face them."],["NIGHT BUS YOUR HEAD ON MY SHOULDER","The night bus smells of diesel and day-old sweat,\nWe take it because taxi is too dear,\nYour head finds my shoulder, heavy, yet,\nLight as permission to be near,\nIn public, unashamed.\n\nThis poem can be very long and it will automatically show Read More button, so readers can click to read full version without scrolling too much."],["YOUR UMBRELLA IS TOO SMALL","Your umbrella is too small for two,\nWe walk like crabs, shoulder to shoulder,\nYou tilt it to my side, I tilt to you,\nWe both get wet, just colder,\nBut never let go to stay dry."],["HOW YOU STEAL MY HOODIE","You steal my hoodie every cold morning,\nNot asking, just wearing it like it's yours,\nYou say it smells better in your adorning,\nThan in my closet behind closed doors,\nAnd you are right, it does."],["THE WAY YOU CHARGE MY PHONE","My phone dies always at eleven percent,\nYou roll your eyes and plug it in,\nYou say I live too loud, too spent,\nAnd never let the low light win,\nYou charge my chaos with your calm."]];let html="";poems.forEach((p,i)=>{let long=p[1].length>150;html+=`<div class="card"><h3>${p[0].replace(/</g,"&lt;")}</h3><p id="t${i}" class="${long?"short":""}">${p[1].replace(/</g,"&lt;")}</p>${long?`<button class="read" id="btn${i}" onclick="let e=document.getElementById('t${i}');e.classList.toggle('full');e.classList.toggle('short');this.innerText=e.classList.contains('full')?'Show less ↑':'Read full poem →'">Read full poem →</button>`:""}<div class="acts"><button id="l${i}" onclick="like(${i})">❤️ <span id="c${i}">0</span> Like</button><button onclick="share(${i})">↗️ Share</button><button onclick="document.getElementById('cb${i}').classList.toggle('on')">💬 Comment</button></div><div class="cbox" id="cb${i}"><input placeholder="Write comment + Enter" onkeydown="if(event.key==='Enter'){add(${i},this.value);this.value=''}"><div id="d${i}"></div></div></div>`});document.getElementById("poems").innerHTML=html;function like(i){let L=JSON.parse(localStorage.likes||"{}");L[i]=(L[i]||0)+1;localStorage.likes=JSON.stringify(L);document.getElementById("c"+i).innerText=L[i];document.getElementById("l"+i).classList.add("liked")}function share(i){let t=poems[i][0]+" - Paul Poetry https://paul-mcrae.github.io/POETRY-/";window.open("https://wa.me/?text="+encodeURIComponent(t))}function add(i,v){if(!v.trim())return;let C=JSON.parse(localStorage.comments||"{}");if(!C[i])C[i]=[];C[i].push(v);localStorage.comments=JSON.stringify(C);show(i)}function show(i){let C=JSON.parse(localStorage.comments||"{}");let d=document.getElementById("d"+i);if(C[i])d.innerHTML=C[i].map(x=>`<div class="citem">💬 ${x.replace(/</g,"&lt;")}</div>`).join("")}let L=JSON.parse(localStorage.likes||"{}");Object.keys(L).forEach(i=>{let e=document.getElementById("c"+i);if(e)e.innerText=L[i]});let C=JSON.parse(localStorage.comments||"{}");Object.keys(C).forEach(i=>show(i));const pool=["https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800","https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800","https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=800","https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=800","https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800","https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800"];setInterval(()=>{document.querySelectorAll("#g img").forEach(img=>{let r=pool[Math.floor(Math.random()*pool.length)];img.style.opacity=0;setTimeout(()=>{img.src=r;img.style.opacity=1},700)})},60000);</script></body></html>

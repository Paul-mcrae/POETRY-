<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PAUL POETRY - Live Watch</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui,sans-serif}header{background:#111;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}header b span{color:#f5c518}.wa{background:#f5c518;color:#000;padding:10px 18px;border-radius:30px;text-decoration:none;font-weight:800;font-size:13px}.live-watch{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);border:1px solid #f5c518;border-radius:16px;padding:14px;margin:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 15px rgba(245,197,24,.15)}.live-watch .time{font-size:28px;font-weight:900;color:#f5c518;letter-spacing:1px}.live-watch .date{font-size:12px;color:#aaa;margin-top:4px}.live-watch .right{text-align:right}.live-watch .dot{display:inline-block;width:8px;height:8px;background:#0f0;border-radius:50%;animation:blink 1s infinite;margin-right:6px}.live-watch .live{font-size:11px;color:#0f0;font-weight:800}.live-watch .place{font-size:11px;color:#888;margin-top:4px}@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.grid img{width:100%;height:180px;object-fit:cover;border-radius:16px}.title{padding:20px 16px 8px;font-size:24px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.title span{font-size:12px;color:#f5c518;background:#1a1a1a;border:1px solid #333;padding:6px 12px;border-radius:20px}.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin:12px}.card h3{color:#f5c518;margin-bottom:8px}.card p{white-space:pre-line;line-height:1.6;color:#ddd;font-size:14px}.card p.short{max-height:75px;overflow:hidden;position:relative}.card p.short:after{content:"";positio thout your sleepy light,\nI measure two spoons just the same,\nOne strong for you, one soft and light,\nAnd wait to hear your morning feet.\n\nYou shuffle in, your hair a tangled crown,\nYour hoodie falling off one sleepy shoulder,\nYou steal my mug and never put it down,\nYou say I'm cold but pull me closer,\nAnd suddenly the day is warmer."],["HOW YOU FOLD MY SHIRTS","You fold my shirts like you mean it,\nNot perfect, but with care in each crease,\nSleeves tucked in, buttons hiding,\nAs if you're telling them peace,\nStay here, he will be back."],["YOUR KEYS ON MY TABLE","Your keys land loud on my table,\nA jingle that means you are home,\nNo knock, no text, no fable,\nJust metal music, you have roamed,\nBack to where you belong."],["GROCERY LIST LOVE","We write our grocery list on the back of bills,\nYour handwriting big, mine cramped and small,\nMilk, bread, eggs, and your little frills,\nChocolate that you say is for us all,\nBut I know you buy it for me."],["WE COOK UGLY RICE","We cook rice that always sticks a bit,\nYou say it's my heat, I say it's your pot,\nWe both are right, we both admit,\nThat perfect rice we have not,\nBut perfect evenings we have."],["THE DISHES AT MIDNIGHT","We do dishes at midnight again,\nBecause we procrastinated all day,\nPlates stacked like our maybe and when,\nSoaked in water turning grey,\nWaiting for us to face them."],["NIGHT BUS YOUR HEAD ON MY SHOULDER","The night bus smells of diesel and day-old sweat,\nWe take it because taxi is too dear,\nYour head finds my shoulder, heavy, yet,\nLight as permission to be near,\nIn public, unashamed."],["YOUR UMBRELLA IS TOO SMALL","Your umbrella is too small for two,\nWe walk like crabs, shoulder to shoulder,\nYou tilt it to my side, I tilt to you,\nWe both get wet, just colder,\nBut never let go to stay dry."],["HOW YOU STEAL MY HOODIE","You steal my hoodie every cold morning,\nNot asking, just wearing it like it's yours,\nYou say it smells better in your adorning,\nThan in my closet behind closed doors,\nAnd you are right, it does."],["THE WAY YOU CHARGE MY PHONE","My phone dies always at eleven percent,\nYou roll your eyes and plug it in,\nYou say I live too loud, too spent,\nAnd never let the low light win,\nYou charge my chaos with your calm."]];let h="";poems.forEach((p,i)=>{let long=p[1].length>150;h+=`<div class="card"><h3>${p[0].replace(/</g,"&lt;")}</h3><p id="t${i}" class="${long?"short":""}">${p[1].replace(/</g,"&lt;")}</p>${long?`<button class="read" onclick="let e=document.getElementById('t${i}');e.classList.toggle('full');e.classList.toggle('short');this.innerText=e.classList.contains('full')?'Show less ↑':'Read full poem →'">Read full poem →</button>`:""}<div class="acts"><button id="l${i}" onclick="like(${i})">❤️ <span id="c${i}">0</span> Like</button><button onclick="share(${i})">↗️ Share</button><button onclick="document.getElementById('cb${i}').classList.toggle('on')">💬 Comment</button></div><div class="cbox" id="cb${i}"><input placeholder="Comment + Enter" onkeydown="if(event.key==='Enter'){add(${i},this.value);this.value=''}"><div id="d${i}"></div></div></div>`});document.getElementById("poems").innerHTML=h;function like(i){let L=JSON.parse(localStorage.likes||"{}");L[i]=(L[i]||0)+1;localStorage.likes=JSON.stringify(L);document.getElementById("c"+i).innerText=L[i];document.getElementById("l"+i).classList.add("liked")}function share(i){let t=poems[i][0]+" https://paul-mcrae.github.io/POETRY-/";window.open("https://wa.me/?text="+encodeURIComponent(t))}function add(i,v){if(!v.trim())return;let C=JSON.parse(localStorage.comments||"{}");if(!C[i])C[i]=[];C[i].push(v);localStorage.comments=JSON.stringify(C);show(i)}function show(i){let C=JSON.parse(localStorage.comments||"{}");let d=document.getElementById("d"+i);if(C[i])d.innerHTML=C[i].map(x=>`<div class="citem">💬 ${x.replace(/</g,"&lt;")}</div>`).join("")}let L=JSON.parse(localStorage.likes||"{}");Object.keys(L).forEach(i=>{let e=document.getElementById("c"+i);if(e)e.innerText=L[i]});let C=JSON.parse(localStorage.comments||"{}");Object.keys(C).forEach(i=>show(i));function updateClock(){let now=new Date();let timeStr=now.toLocaleTimeString('en-GB',{timeZone:'Africa/Kampala',hour12:false});let dateStr=now.toLocaleDateString('en-GB',{timeZone:'Africa/Kampala',weekday:'long',year:'numeric',month:'long',day:'numeric'});let sec=timeStr.split(':')[2];document.getElementById("clock").innerText=timeStr;document.getElementById("date").innerText=dateStr;document.getElementById("sec").innerText=sec+" seconds";document.getElementById("ft").innerText=timeStr+" EAT - Kampala";}updateClock();setInterval(updateClock,1000);</script></body></html>
